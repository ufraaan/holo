version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "frontend"
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/signaling"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "signaling"
    open-pull-requests-limit: 0
