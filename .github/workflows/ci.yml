name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  frontend-core:
    name: Frontend Lint Typecheck Build Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

  backend-core:
    name: Backend Format Vet Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Check gofmt
        run: |
          test -z "$(gofmt -l .)" || (echo "Run gofmt on backend files" && gofmt -l . && exit 1)

      - name: Go vet
        run: go vet ./...

      - name: Go tests
        run: go test ./...

      - name: Build
        run: go build -o /dev/null ./cmd/holo-server/

