name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  p2p:
    name: Signaling and P2P Transfers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - name: Install signaling dependencies
        working-directory: signaling
        run: bun install --frozen-lockfile

      - name: Check signaling runtime
        working-directory: signaling
        run: bun run check

      - name: Check Worker bundle without deploying
        working-directory: signaling
        run: bunx wrangler deploy --dry-run

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: frontend
        run: bunx playwright install --with-deps chromium

      - name: Test P2P transfers locally
        working-directory: frontend
        run: bun run test:e2e
        env:
          CI: true

  frontend-core:
    name: Frontend Lint Typecheck Build Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

