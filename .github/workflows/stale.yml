name: Stale

on:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: "this issue has been inactive for 60 days. it will be closed in 14 days if there is no further activity."
          stale-pr-message: "this pull request has been inactive for 60 days. it will be closed in 14 days if there is no further activity."
          close-issue-message: "closing due to inactivity."
          close-pr-message: "closing due to inactivity."
          labels-to-add-when-unstale: "pinned"
