name: Browser transfers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Browser transfers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - name: Install signaling dependencies
        working-directory: signaling
        run: bun install --frozen-lockfile

      - name: Check signaling runtime
        working-directory: signaling
        run: bun run check

      - name: Check Worker bundle without deploying
        working-directory: signaling
        run: bunx wrangler deploy --dry-run --env=""

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: frontend
        run: bunx playwright install --with-deps chromium

      - name: Test P2P transfers locally
        working-directory: frontend
        run: bun run test:e2e
        env:
          CI: true
