name: Security Checks

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  bun-audit:
    name: Bun Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run bun audit
        run: bun audit
