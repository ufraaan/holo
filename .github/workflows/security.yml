name: Security Checks

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
