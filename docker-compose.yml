services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - HOLO_ADDR=:8080

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend
